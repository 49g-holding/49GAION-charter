# Checks of this mother repository, on every pull request and on main: the one checks workflow of
# the Library repositories, `library-checks.yml` of 49GAION-protocol, called at the commit in
# PROTOCOL-PIN (the `uses:` line below must name the same commit; the workflow's first job checks it).
# Jobs: checks / pin, checks / cards, checks / no-persian, checks / no-org-names, checks / no-binaries,
# checks / dr-frozen. The pin moves by a pull request that changes PROTOCOL-PIN and this line together.
name: checks

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    uses: 49g-holding/49GAION-protocol/.github/workflows/library-checks.yml@525457c0cee0442831dfe784e7e1198d1504b8e6
    with:
      kind: mother
