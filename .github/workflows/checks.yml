# Checks of this mother repository, on every pull request and on main: the one set of checks of the
# Library repositories, the action `library-checks` of 49GAION-protocol, run at the commit in
# PROTOCOL-PIN (every `uses:` line below must name the same commit; the `pin` check fails if not).
# cards: the cards in cards/ are exactly what tools/make_cards.py generates from the blueprint, and
#        validate against the schemas of 49GAION-protocol at the pin.
# no-persian: no Persian or Arabic-script character in any tracked file, the PR title or the PR body.
# no-org-names: the scanner of 49GAION-protocol at the pin finds no organisation name, host or code.
# no-binaries: a binary file is never added. dr-frozen: a decision record on main never changes.
# links: every relative link in a Markdown file resolves (49GAION/DR-0052).
# The pin moves by a pull request that changes PROTOCOL-PIN and every uses line together.
name: checks

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: 49g-holding/49GAION-protocol/.github/actions/library-checks@afc91b670837cd46f2c881b27d1ee5d928aeb907
        with:
          check: pin

  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: 49g-holding/49GAION-protocol/.github/actions/library-checks@afc91b670837cd46f2c881b27d1ee5d928aeb907
        with:
          check: cards

  no-persian:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: 49g-holding/49GAION-protocol/.github/actions/library-checks@afc91b670837cd46f2c881b27d1ee5d928aeb907
        with:
          check: no-persian

  no-org-names:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: 49g-holding/49GAION-protocol/.github/actions/library-checks@afc91b670837cd46f2c881b27d1ee5d928aeb907
        with:
          check: no-org-names

  no-binaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: 49g-holding/49GAION-protocol/.github/actions/library-checks@afc91b670837cd46f2c881b27d1ee5d928aeb907
        with:
          check: no-binaries

  dr-frozen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: 49g-holding/49GAION-protocol/.github/actions/library-checks@afc91b670837cd46f2c881b27d1ee5d928aeb907
        with:
          check: dr-frozen

  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: 49g-holding/49GAION-protocol/.github/actions/library-checks@afc91b670837cd46f2c881b27d1ee5d928aeb907
        with:
          check: links
